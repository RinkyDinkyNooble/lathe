pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'lathe'

// Shared code lives in common/ (not a project of its own): each port folder compiles it into its own jar.
// One folder per loader + Minecraft version.
include 'forge-1.20.1'
include 'fabric-1.20.1'
