org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle 7: each source set's classes and resources in one folder, as Forge's dev runs expect.
net.minecraftforge.gradle.merge-source-sets=true

# Forge. Built against the newest 26.2 release; the ranges are the oldest versions Lathe works with (Forge 65 is for
# Minecraft 26.2). The shared mod info is in ../gradle.properties.
forge_minecraft_version=26.2
forge_minecraft_version_range=[26.2,26.3)
forge_version=65.1.6
forge_version_range=[65,)
forge_loader_version_range=[65,)
