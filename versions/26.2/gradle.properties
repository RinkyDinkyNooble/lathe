org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Shared by every loader (the same values as the root build's)
mod_id=lathe
mod_name=Lathe
mod_version=0.3.0
mod_group_id=com.rinkynooble.lathe
mod_authors=RinkyNooble
mod_license=0BSD
mod_description=Makes slabs, vertical slabs, stairs, vertical stairs, corners, quarters and eighths for the blocks you list in config/lathe/. Each shape is a real block with its own id, looks like its source block, and can be used in Lost Cities palettes.
mod_url=https://github.com/RinkyDinkyNooble/lathe
mod_issues=https://github.com/RinkyDinkyNooble/lathe/issues

# This group's name, in every jar's name: lathe-<loader>-26.2-<version>.jar
version_group=26.2

# Each loader's own keys are in <loader>/gradle.properties.
