neoforge_minecraft_version_range=[26.2,26.3)
neoforge_version=26.2.0.95
neoforge_version_range=[26.2.0.0-beta,)

# Mods for the NeoForge dev runs only, from Modrinth's maven.
# McJty's The Lost Cities 26.2-11.0.3 for NeoForge 26.2 (Modrinth version id).
