# Sodium and Iris for the client checks (-PwithRenderers): the newest NeoForge 26.2 builds
# (Iris 1.11.4 requires Sodium 0.9.2). Override with -PsodiumVersion=... -PirisVersion=...
sodium_version=mc26.2-0.9.2-neoforge
iris_version=1.11.4+26.2-neoforge
