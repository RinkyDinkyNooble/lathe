plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

base {
    archivesName = "${mod_id}-neoforge-${version_group}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The shared code (common/) is compiled straight into this jar.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

// Dev-only checks (see README, "Testing"): a mod of their own, latheverify, never shipped with Lathe.
sourceSets {
    verify {
        java.srcDir rootProject.file('common/src/verify/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    verifyImplementation.extendsFrom implementation
    verifyRuntimeOnly.extendsFrom runtimeOnly
    verifyCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = neoforge_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        latheverify {
            sourceSet sourceSets.verify
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            gameDirectory = project.file('run')
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}"]
        }
        // A client and a server with the dev-only checks loaded too.
        verifyClient {
            client()
            gameDirectory = project.file('run')
            sourceSet = sourceSets.verify
            systemProperty 'lathe.verify', 'true'
            // Joins run/saves/lathe-test straight away (copied from the verify server's world; see README).
            programArguments.addAll '--quickPlaySingleplayer', 'lathe-test', '--width', '1280', '--height', '720'
        }
        verifyServer {
            server()
            gameDirectory = project.file('run-server')
            sourceSet = sourceSets.verify
            systemProperty 'lathe.verify', 'true'
            programArgument '--nogui'
        }
        // Joins the dev server (gradlew runServer) and records what happened, for the rules check (see README).
        joinClient {
            client()
            gameDirectory = project.file('run-join')
            sourceSet = sourceSets.verify
            systemProperty 'lathe.verify.join', 'true'
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565', '--width', '854', '--height', '480'
        }
    }
}

// Minecraft and NeoForge for the checks too.
neoForge.addModdingDependenciesTo(sourceSets.verify)

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// Sodium 0.8 for NeoForge is a library jar (its early checks and workarounds) that adds the real mod and its
// Forgified Fabric API modules from nested jars through its own mod locator. A dev run takes the wrapper itself for
// the mod and never loads the nested ones, so the client checks load the nested jars directly, plus the wrapper's
// classes without its mod metadata and locator.
configurations {
    sodiumWrapper { transitive = false }
}
var unpackSodium = tasks.register('unpackSodium', Sync) {
    from { configurations.sodiumWrapper.collect { zipTree(it) } }
    include 'META-INF/jarjar/*.jar'
    eachFile { path = name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('sodium-jars')
}
var sodiumServiceJar = tasks.register('sodiumServiceJar', Jar) {
    from { configurations.sodiumWrapper.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF', 'META-INF/neoforge.mods.toml', 'META-INF/jarjar/**',
            'META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator'
    manifest.attributes('FMLModType': 'LIBRARY', 'Automatic-Module-Name': 'sodium_service')
    archiveFileName = 'sodium-service.jar'
    destinationDirectory = layout.buildDirectory.dir('sodium-service')
}

dependencies {
    // Loaded in the dev runs only. Lathe doesn't depend on it.
    runtimeOnly "maven.modrinth:the-lost-cities:${lostcities_version}"
    verifyCompileOnly "maven.modrinth:the-lost-cities:${lostcities_version}"
    // Sodium and Iris for the client checks with -PwithRenderers (dev runs only).
    if (project.hasProperty('withRenderers')) {
        sodiumWrapper "maven.modrinth:sodium:${project.findProperty('sodiumVersion') ?: sodium_version}"
        runtimeOnly fileTree(unpackSodium.map { it.destinationDir }) { include '*.jar' }.builtBy(unpackSodium)
        runtimeOnly files(sodiumServiceJar)
        runtimeOnly "maven.modrinth:iris:${project.findProperty('irisVersion') ?: iris_version}"
    }
}

var replaceProperties = [
        minecraft_version_range: neoforge_minecraft_version_range,
        neoforge_version_range: neoforge_version_range, loader_version_range: neoforge_loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
        mod_url: mod_url, mod_issues: mod_issues,
]

processResources {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

processVerifyResources {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    // Ship the license inside the jar too (the repo's, two folders up).
    from(rootProject.file('../../LICENSE')) {
        rename { "LICENSE_${mod_id}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    // NeoForge marks BlockItem.removeFromBlockToItemMap (overridden in common's LatheSlabItem) for removal; expected.
    options.compilerArgs << '-Xlint:-removal'
}

// The checks as a mod jar of their own, for real NeoForge servers (see README). Never shipped.
tasks.register('verifyJar', Jar) {
    archiveClassifier = 'verify'
    from sourceSets.verify.output
}
