neoforge_minecraft_version_range=[1.21,1.21.2)
neoforge_version=21.1.267
neoforge_version_range=[21.0.143,)
neoforge_loader_version_range=[4,)

# Mods for the NeoForge dev runs only, from Modrinth's maven.
# McJty's The Lost Cities 1.21-8.4.6 for NeoForge 1.21.1 (Modrinth version id).
lostcities_version=jqhDeD82
# Sodium and Iris for the client checks (-PwithRenderers): the newest NeoForge 1.21.1 builds
# (Iris 1.8.14-beta.1 requires Sodium 0.8.13). Override with -PsodiumVersion=... -PirisVersion=...
sodium_version=mc1.21.1-0.8.13-neoforge
iris_version=1.8.14-beta.1+1.21.1-neoforge
