# NeoForge. Built against the newest 1.21.1 release; the ranges are the oldest versions Lathe works with
# (NeoForge 21.0 is for Minecraft 1.21, 21.1 for 1.21.1; 21.0.143 is 21.0's first release that isn't a beta).
