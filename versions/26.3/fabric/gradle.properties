# Fabric (also runs on Quilt with QFAPI; see README). Built against 26.3; the ranges are the oldest versions Lathe
# works with. 26.x is unobfuscated: nothing is remapped.
fabric_minecraft_version=26.3
fabric_minecraft_version_range=>=26.3 <26.4
# Built with Loader 0.19.5 because the dev runs' Lost Cities needs it; Lathe itself also builds with its minimum
# (gradlew -Pfabric_loader_version=0.19.3 ...), the oldest Loader any Fabric API for 26.3 takes.
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.19.3
fabric_api_version=0.166.2+26.3
fabric_api_version_range=>=0.160.5

# Mods for the Fabric dev runs only, from Modrinth's maven (by version id, since the numbers repeat across versions).
# Lost Cities: McJty's own Fabric build for 26.3 (project the-lost-cities, 26.3-12.0.0-fabric), which needs Forge
# Config API Port (26.3.1). Removing the two lostcities keys leaves Lost Cities out (its checks then say so).
lostcities_fabric_project=8VDCUS3b
lostcities_fabric_version=xuEuPjKk
forge_config_api_port_version=JpKvrr9J
sodium_version=mc26.3-0.9.2-fabric
iris_version=1.11.7+26.3-fabric
