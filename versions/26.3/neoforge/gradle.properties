# NeoForge. Built against the newest 26.3 release; the ranges are the oldest versions Lathe works with.
# 26.x is unobfuscated: nothing is remapped.
neoforge_minecraft_version=26.3
neoforge_minecraft_version_range=[26.3,26.4)
neoforge_version=26.3.0.113
neoforge_version_range=[26.3.0.0-beta,)

# Mods for the NeoForge dev runs only, from Modrinth's maven.
# McJty's The Lost Cities 26.3-12.0.0 for NeoForge 26.3 (Modrinth version id).
lostcities_version=qWrk5qzZ

# Sodium and Iris for the client checks (-PwithRenderers): Iris 1.11.7 (the newest for NeoForge 26.3) and Sodium
# 0.9.3-beta.3. Sodium 0.9.2, the newest release and the one Iris 1.11.7 names, can't start on NeoForge 26.3.0.65-beta
# or newer (its LevelExtractor mixin; fixed in 0.9.3-beta.1); 0.9.3-beta.4 and newer refuse Iris below 1.11.8, which
# isn't out for NeoForge 26.3. Override with -PsodiumVersion=... -PirisVersion=...
sodium_version=mc26.3-0.9.3-beta.3-neoforge
iris_version=1.11.7+26.3-neoforge
