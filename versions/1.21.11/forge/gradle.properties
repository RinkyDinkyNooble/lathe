org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle 7: each source set's classes and resources in one folder, as Forge's dev runs expect.
net.minecraftforge.gradle.merge-source-sets=true

# Forge. Built against the newest 1.21.11 release; the ranges are the oldest versions Lathe works with
# (Forge 61 is for Minecraft 1.21.11). The shared mod info is in ../gradle.properties.
forge_minecraft_version=1.21.11
forge_minecraft_version_range=[1.21.11,1.21.12)
forge_version=61.2.5
forge_version_range=[61,)
forge_loader_version_range=[61,)
