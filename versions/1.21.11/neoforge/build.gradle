plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

base {
    archivesName = "${mod_id}-neoforge-${version_group}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The shared code (common/) is compiled straight into this jar.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

// Dev-only checks (see README, "Testing"): a mod of their own, latheverify, never shipped with Lathe.
sourceSets {
    verify {
        java.srcDir rootProject.file('common/src/verify/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    verifyImplementation.extendsFrom implementation
    verifyRuntimeOnly.extendsFrom runtimeOnly
    verifyCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = neoforge_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        latheverify {
            sourceSet sourceSets.verify
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            gameDirectory = project.file('run')
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}"]
        }
        // A client and a server with the dev-only checks loaded too.
        verifyClient {
            client()
            gameDirectory = project.file('run')
            sourceSet = sourceSets.verify
            systemProperty 'lathe.verify', 'true'
            // Joins run/saves/lathe-test straight away (copied from the verify server's world; see README).
            programArguments.addAll '--quickPlaySingleplayer', 'lathe-test', '--width', '1280', '--height', '720'
        }
        verifyServer {
            server()
            gameDirectory = project.file('run-server')
            sourceSet = sourceSets.verify
            systemProperty 'lathe.verify', 'true'
            programArgument '--nogui'
        }
        // Joins the dev server (gradlew runServer) and records what happened, for the rules check (see README).
        joinClient {
            client()
            gameDirectory = project.file('run-join')
            sourceSet = sourceSets.verify
            systemProperty 'lathe.verify.join', 'true'
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565', '--width', '854', '--height', '480'
        }
    }
}

// Minecraft and NeoForge for the checks too.
neoForge.addModdingDependenciesTo(sourceSets.verify)

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Loaded in the dev runs only. Lathe doesn't depend on it.
    runtimeOnly "maven.modrinth:the-lost-cities:${lostcities_version}"
    verifyCompileOnly "maven.modrinth:the-lost-cities:${lostcities_version}"
}

var replaceProperties = [
        minecraft_version_range: neoforge_minecraft_version_range,
        neoforge_version_range: neoforge_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
        mod_url: mod_url, mod_issues: mod_issues,
]

processResources {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

processVerifyResources {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    // Ship the license inside the jar too (the repo's, two folders up).
    from(rootProject.file('../../LICENSE')) {
        rename { "LICENSE_${mod_id}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    // NeoForge marks BlockItem.removeFromBlockToItemMap (overridden in common's LatheSlabItem) for removal; expected.
    options.compilerArgs << '-Xlint:-removal'
}

// The checks as a mod jar of their own, for real NeoForge servers (see README). Never shipped.
tasks.register('verifyJar', Jar) {
    archiveClassifier = 'verify'
    from sourceSets.verify.output
}
