# Fabric (also runs on Quilt with QFAPI; see README). Built against the newest 1.21.11 releases; the ranges are the
# oldest versions Lathe works with.
fabric_minecraft_version=1.21.11
fabric_minecraft_version_range=>=1.21.11 <1.21.12
fabric_loader_version=0.18.4
fabric_loader_version_range=>=0.17.3
fabric_api_version=0.141.6+1.21.11
fabric_api_version_range=>=0.139.4

# Mods for the Fabric dev runs only, from Modrinth's maven (by version id, since the numbers repeat across versions).
# The Lost Cities Fabric port 1.2.0 for 1.21.11 (project tsxv5KHT, version i7mir4E4).
lostcities_fabric_project=tsxv5KHT
lostcities_fabric_version=i7mir4E4
# Forge Config API Port 21.11.1 for Fabric 1.21.11.
forge_config_api_port_version=uXrWPsCu
# Sodium and Iris for the client checks with -PwithRenderers: the newest 1.21.11 pair built with a Loom this build
# accepts (Loom 1.15 refuses jars built with 1.16, as Sodium 0.8.13+ and Iris 1.10.8 are). Iris 1.10.7 pairs with 0.8.7.
sodium_version=mc1.21.11-0.8.7-fabric
iris_version=1.10.7+1.21.11-fabric
