# Fabric (also runs on Quilt with QFAPI; see README). Built against 26.1.2 (the hotfix most players are on); the
# ranges are the oldest versions Lathe works with. 26.1 is unobfuscated: nothing is remapped.
fabric_minecraft_version=26.1.2
fabric_minecraft_version_range=>=26.1 <26.2
fabric_loader_version=0.18.4
fabric_loader_version_range=>=0.18.4
fabric_api_version=0.155.3+26.1.2
fabric_api_version_range=>=0.144.0

# Mods for the Fabric dev runs only, from Modrinth's maven (by version id, since the numbers repeat across versions).
# No Lost Cities Fabric port exists for 26.1 (sunshainy's port stops at 1.21.11; McJty's 26.1.2 build is NeoForge
# only), so the dev runs have no Lost Cities and its checks say so. To add one later, set these two keys (and
# forge_config_api_port_version if it needs Forge Config API Port).
#lostcities_fabric_project=
#lostcities_fabric_version=
sodium_version=mc26.1.2-0.9.2-fabric
iris_version=1.11.4+26.1-fabric
