pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'lathe-26.1'

// Lathe for Minecraft 26.1-26.1.2. Shared code lives in common/ (not a project of its own): each loader folder
// compiles it into its own jar. A loader folder joins the build once it has a build.gradle, unless it's a build of
// its own (its own settings.gradle, for a loader plugin that needs another Gradle version).
['fabric', 'neoforge', 'forge'].each { loader ->
    if (file("${loader}/build.gradle").exists() && !file("${loader}/settings.gradle").exists()) include loader
}
