plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

// The group's shared mod info (mod_id, mod_version...), in ../gradle.properties: this folder is a build of its own.
var shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
shared.stringPropertyNames().findAll { !it.startsWith('org.gradle.') }.each { ext.set(it, shared.getProperty(it)) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-forge-${version_group}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The shared code (common/) is compiled straight into this jar.
sourceSets.main.java.srcDir file('../common/src/main/java')
sourceSets.main.resources.srcDir file('../common/src/main/resources')

// Dev-only checks (see README, "Testing"): a mod of their own, latheverify, never shipped with Lathe.
sourceSets {
    verify {
        java.srcDir file('../common/src/verify/java')
        // McJty's Lost Cities has no Forge build for 26.1: its checks can't run here (ForgeVerify reports them
        // missing), so they aren't compiled either.
        java.exclude '**/verify/LostCitiesChecks.java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Nothing of its own and no Lathe: runWithoutLatheClient is a plain Forge client, for the rules check's
    // "client without Lathe" case (see README).
    withoutLathe {
    }
}

configurations {
    withoutLatheImplementation.extendsFrom implementation
    verifyImplementation.extendsFrom implementation
    verifyRuntimeOnly.extendsFrom runtimeOnly
    verifyCompileOnly.extendsFrom compileOnly
}

// The dev runs' launcher (Forge's Slime Launcher) asks for a Java 8 install by default, only to learn its Java
// version; give it the build's Java 25 instead (the runs need 25 anyway).
fgtools.configure('slimelauncher') {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

minecraft {
    // Minecraft 26.1 ships with Mojang's names (no obfuscation), so there are no mappings to pick.

    // ForgeGradle makes each run for every source set: runClient and runServer load Lathe alone; runVerifyClient
    // and runVerifyServer load the checks too (latheverify, from the verify source set).
    runs {
        // Forge 52, 61 and 64 find the dev mods on the run's classpath, one per folder (each source set's output is one folder,
        // see merge-source-sets in gradle.properties), so the runs need no mods {} lists.
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }
        register('client') {
            workingDir = layout.projectDirectory.dir('run')
            with(sourceSets.verify) {
                if (project.hasProperty('join')) {
                    // runVerifyClient -Pjoin: joins the dev server (runServer) and records what happened, for the
                    // rules check (see README).
                    workingDir = layout.projectDirectory.dir('run-join')
                    systemProperty 'lathe.verify.join', 'true'
                    args '--quickPlayMultiplayer', 'localhost:25565', '--width', '854', '--height', '480'
                } else {
                    systemProperty 'lathe.verify', 'true'
                    // Joins run/saves/lathe-test straight away (copied from the verify server's world; see README).
                    args '--quickPlaySingleplayer', 'lathe-test', '--width', '1280', '--height', '720'
                }
            }
            with(sourceSets.withoutLathe) {
                // Joins the dev server (runServer), which should refuse it with "This server uses Lathe...".
                workingDir = layout.projectDirectory.dir('run-without-lathe')
                args '--quickPlayMultiplayer', 'localhost:25565', '--width', '854', '--height', '480'
            }
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('run-server')
            args '--nogui'
            with(sourceSets.verify) {
                systemProperty 'lathe.verify', 'true'
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}")
    // Checks event listeners at compile time (EventBus 7), as the MDK does.
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
    verifyAnnotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

var replaceProperties = [
        minecraft_version_range: forge_minecraft_version_range,
        forge_version_range: forge_version_range, loader_version_range: forge_loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
        mod_url: mod_url, mod_issues: mod_issues,
]

tasks.named('processResources', ProcessResources) {
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('processVerifyResources', ProcessResources) {
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    // Ship the license inside the jar too (the repo's, three folders up).
    from(file('../../../LICENSE')) {
        rename { "LICENSE_${mod_id}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    // Forge marks some of the API Lathe uses for removal in later versions; that's expected here.
    options.compilerArgs << '-Xlint:-removal'
}

// The checks as a mod jar of their own, for real Forge servers (see README). Never shipped.
tasks.register('verifyJar', Jar) {
    archiveClassifier = 'verify'
    from sourceSets.verify.output
}
