org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle 7: each source set's classes and resources in one folder, as Forge's dev runs expect.
net.minecraftforge.gradle.merge-source-sets=true

# Forge. Built against the newest 26.1.2 release; the ranges are the oldest versions Lathe works with (Forge gives each
# 26.1 hotfix its own major: 62 is for Minecraft 26.1, 63 for 26.1.1, 64 for 26.1.2). The shared mod info is in
# ../gradle.properties.
forge_minecraft_version=26.1.2
forge_minecraft_version_range=[26.1,26.2)
forge_version=64.1.6
forge_version_range=[62,)
forge_loader_version_range=[62,)
