plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Dev-only checks (see README, "Testing"). Never packed into the mod's jar.
sourceSets {
    verify {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    verifyImplementation.extendsFrom implementation
    verifyRuntimeOnly.extendsFrom runtimeOnly
    verifyCompileOnly.extendsFrom compileOnly
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            // Embeddium's and Oculus's mixins use production names, so the dev runs remap them.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
            args '--nogui'
        }
        // A client and a server with the dev-only checks loaded too.
        verifyClient {
            parent runs.client
            workingDirectory project.file('run')
            property 'lathe.verify', 'true'
            // Joins run/saves/lathe-test straight away (copied from the verify server's world; see README).
            args '--quickPlaySingleplayer', 'lathe-test', '--width', '1280', '--height', '720'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.verify
                }
            }
        }
        verifyServer {
            parent runs.server
            workingDirectory project.file('run-server')
            property 'lathe.verify', 'true'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.verify
                }
            }
        }
    }
}

repositories {
    // BetterBlockZ, The Lost Cities, Embeddium and Oculus jars for the dev runs (see README).
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Loaded in the dev runs only. Lathe doesn't depend on any of them.
    runtimeOnly fg.deobf("local:betterblockz:${betterblockz_version}")
    runtimeOnly fg.deobf("local:lostcities:${lostcities_version}")
    verifyCompileOnly fg.deobf("local:lostcities:${lostcities_version}")
    if (project.hasProperty('withRenderers')) {
        runtimeOnly fg.deobf("local:embeddium:${embeddium_version}")
        runtimeOnly fg.deobf("local:oculus:${oculus_version}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
            mod_url: mod_url, mod_issues: mod_issues,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    // Ship the license inside the jar too.
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Forge 47 marks much of the 1.20.1 API for removal in later versions; that's expected here.
    options.compilerArgs << '-Xlint:-removal'
}
